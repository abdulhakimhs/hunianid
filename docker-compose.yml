services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hunianid-v2-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=hunianid-v2
    networks:
      - hunianid-v2

  nginx:
    image: nginx:stable-alpine
    container_name: hunianid-v2-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hunianid-v2

networks:
  hunianid-v2:
    driver: bridge
