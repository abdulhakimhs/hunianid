services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hunianid-v2-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=hunianid-v2
    networks:
      - hunianid-v2

  # Dev-friendly stand-in for a real cron entry (`* * * * * php artisan schedule:run`).
  # Runs the same image as `app`, just looping schedule:run every minute instead of
  # serving php-fpm. In production, prefer a real cron entry over this loop.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hunianid-v2-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
    networks:
      - hunianid-v2

  nginx:
    image: nginx:stable-alpine
    container_name: hunianid-v2-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hunianid-v2

networks:
  hunianid-v2:
    driver: bridge
