server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # sw.js is emitted under /build/ (Laravel's Vite asset dir), but it must
    # control the whole app (/security/*, /tenant/*, …), not just /build/ —
    # browsers refuse a wider registration scope than the script's own
    # directory unless the server explicitly allows it via this header.
    location = /build/sw.js {
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # The Link: preload header (fonts + Vite chunks, see
        # AddLinkHeadersForPreloadedAssets) easily exceeds nginx's 4-8k default
        # FastCGI header buffer once asset URLs use a real hostname instead of
        # short "localhost:8000" ones — nginx then 502s with "upstream sent too
        # big header" even though PHP-FPM responded fine.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
